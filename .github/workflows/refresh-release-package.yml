name: refresh-release-package

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-release-package.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build clean release package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          rm -f Sauler-IE-Portraits-v0.1.0.zip Sauler-IE-Portraits-v0.1.0.sha256
          mkdir -p package/Sauler-IE-portraits
          cp Sauler-IE-portraits.tp2 README.md CREDITS.md package/Sauler-IE-portraits/
          cp -R data docs tra package/Sauler-IE-portraits/
          cp setup-Sauler-IE-portraits.exe package/
          (
            cd package
            zip -r ../Sauler-IE-Portraits-v0.1.0.zip Sauler-IE-portraits setup-Sauler-IE-portraits.exe
          )
          sha256sum Sauler-IE-Portraits-v0.1.0.zip > Sauler-IE-Portraits-v0.1.0.sha256

      - name: Replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v0.1.0             Sauler-IE-Portraits-v0.1.0.zip             Sauler-IE-Portraits-v0.1.0.sha256             --clobber

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sauler"
          git config user.email "138236347+Sauler89@users.noreply.github.com"
          rm -f .github/workflows/refresh-release-package.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m "Remove temporary release workflow"
          git push origin HEAD:main
