name: remove-sha256-asset

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/remove-sha256-asset.yml'

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove SHA-256 release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset v0.1.0 Sauler-IE-Portraits-v0.1.0.sha256 --yes

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sauler"
          git config user.email "138236347+Sauler89@users.noreply.github.com"
          rm -f .github/workflows/remove-sha256-asset.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m "Remove temporary workflow"
          git push origin HEAD:main
